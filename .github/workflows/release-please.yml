name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
    # Manifest mode: reads release-please-config.json + .release-please-manifest.json
    # from the repo. Simple mode (release-type input) ignores the manifest and would
    # restart versioning at 0.1.0 if no git tags exist yet.
    - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
      with:
        token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
