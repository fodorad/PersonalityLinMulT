# Audio-only (A) experiment group: WavLM + Emotion2vec.
#
# A modality-isolation arm. Reads the acoustic subset from the same shared
# fi.h5 as avt.yaml -- no rebuild: the builder wrote all 7 features into one
# file, and reading a subset touches only those features' byte ranges. Two
# features, so this is still LinMulT (cross-modal fusion within the modality),
# not LinT.
h5_path: data/processed/FI/h5/fi.h5
label_csv: data/processed/FI/label.csv
features:
  - wavlm
  - emotion2vec

# Clips are 15.32-15.36 s; the window is applied on read (no rebuild to change).
window_seconds: 15.0
crop_mode: head

batch_size: 16
num_workers: 8
pin_memory: true
persistent_workers: true
prefetch_factor: 2
seed: 42
