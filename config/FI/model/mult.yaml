# LinMulT: linear-complexity cross-modal attention.
#
# Keys track linmult 2.x. The 1.5.2 names the old configs used (n_heads,
# n_layers, dropout_qkv/relu/residual, output_dim, ffn_fusion) no longer exist
# upstream and are rejected with a rename hint rather than silently ignored.
# input_feature_dim is absent by design: it is read from the h5's feature attrs
# so the model cannot disagree with its data.
name: MulT
d_model: 32
num_heads: 8
cmt_num_layers: 5
branch_sat_num_layers: 5

attention_type: softmax  # quadratic attention: the MulT baseline

dropout_input: 0.0
dropout_output: 0.2
dropout_pe: 0.1
dropout_ffn: 0.2
# Kept in parity with linmult.yaml's dropout_attention (see its comment) so
# this file's only difference from linmult.yaml stays attention_type + name --
# the MulT-vs-LinMulT ablation must isolate attention mechanism alone.
dropout_attention: 0.2

# linmult 2.x defaults this to true, but the published 1.5.2 results had no TCN.
# Explicit here so parity is a choice; flip it to run the TCN experiment.
add_module_tcn: false

time_dim_reducer: gap
add_module_ffn_fusion: true

head_type: simple
head_dropout: 0.2
head_hidden_dim: 256
